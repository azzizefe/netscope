[package]
name = "netscope-agent"
description = "Netscope Sensor Agent — remote capture agent for sensor fleet management"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
rustls = "0.23"
futures-util = "0.3"
# Kept in step with `netscope-server`'s sqlx: both reach `libsqlite3-sys`, and
# only one version of a `-sys` crate can exist in a build. rusqlite 0.32 moved
# to libsqlite3-sys 0.30, which is what sqlx 0.8.6 also wants — pinned lower,
# the whole workspace was stuck on sqlx 0.8.0 and its future-incompat warning.
rusqlite = { version = "0.32", features = ["bundled"] }
zstd = "0.13"
sha2 = "0.10"
# Verifies the ed25519 signature on a downloaded agent binary. Chosen over a
# raw ed25519 crate because the signing half is an existing CLI (`minisign` /
# `rsign2`) that a release workflow can run, rather than something that has to
# be written first.
minisign-verify = "0.2"
# Version ordering. `"0.10.0" > "0.9.0"` is false as strings, which is how the
# upgrade check used to compare them.
semver = "1"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
sysinfo = "0.33"
uuid = { version = "1", features = ["v4", "serde"] }
anyhow = "1"
parking_lot = "0.12"
dirs = "6"
num_cpus = "1"

[features]
default = []

[lints]
workspace = true
