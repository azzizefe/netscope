name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

jobs:
  tui:
    name: TUI (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: netscope-tui
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            binary: netscope-tui
          - os: macos-latest
            target: aarch64-apple-darwin
            binary: netscope-tui
          - os: macos-latest
            target: x86_64-apple-darwin
            binary: netscope-tui
          - os: macos-latest
            target: universal-apple-darwin
            binary: netscope-tui
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: netscope-tui.exe
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            binary: netscope-tui.exe
            # arm64 Windows is a cross-compile that CI never exercises and that
            # needs both the arm64 MSVC toolchain and an arm64 Npcap lib. Mark it
            # best-effort so a failure here can't block the whole release; when it
            # succeeds the binary is still published.
            experimental: true
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental || false }}
    timeout-minutes: 30
    # Same opt-in Authenticode secrets the desktop job uses, so the standalone
    # TUI .exe is signed with the same certificate as the installers. The Apple
    # secrets are here rather than on the step because a step's `if:` cannot see
    # that step's own `env:` — only workflow- and job-level entries.
    env:
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target == 'universal-apple-darwin' && 'aarch64-apple-darwin,x86_64-apple-darwin' || matrix.target }}
      - uses: Swatinem/rust-cache@v2

      - name: Install libpcap (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libpcap-dev
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          fi

      - name: Install Npcap SDK (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://npcap.com/dist/npcap-sdk-1.13.zip" -OutFile "$env:TEMP\npcap-sdk.zip" -UseBasicParsing
          Expand-Archive -Path "$env:TEMP\npcap-sdk.zip" -DestinationPath "$env:TEMP\npcap-sdk" -Force
          $libDir = if ("${{ matrix.target }}" -eq "aarch64-pc-windows-msvc") { "$env:TEMP\npcap-sdk\Lib\ARM64" } else { "$env:TEMP\npcap-sdk\Lib\x64" }
          if (-not (Test-Path $libDir)) { $libDir = "$env:TEMP\npcap-sdk\Lib\x64" }
          echo "LIBPCAP_LIBDIR=$libDir" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build TUI binary
        shell: bash
        run: |
          if [ "${{ matrix.target }}" = "universal-apple-darwin" ]; then
            rustup target add aarch64-apple-darwin x86_64-apple-darwin
            cargo build -p netscope-tui --release --target aarch64-apple-darwin
            cargo build -p netscope-tui --release --target x86_64-apple-darwin
            mkdir -p target/universal-apple-darwin/release
            lipo -create \
              -output target/universal-apple-darwin/release/${{ matrix.binary }} \
              target/aarch64-apple-darwin/release/${{ matrix.binary }} \
              target/x86_64-apple-darwin/release/${{ matrix.binary }}
          else
            cargo build -p netscope-tui --release --target ${{ matrix.target }}
          fi

      # Authenticode-sign the TUI binary (ROADMAP §8.3). Opt-in on the same two
      # secrets as the desktop job; unset -> step skipped -> unsigned binary and
      # the build still succeeds. signtool.exe ships with the Windows SDK but is
      # not on PATH, so resolve the newest x64 one under Windows Kits.
      # A failure here is fatal on purpose: if signing was asked for and could
      # not be done, publishing an unsigned .exe under the same release would be
      # worse than failing.
      - name: Sign TUI binary (Windows)
        if: runner.os == 'Windows' && env.WINDOWS_CERTIFICATE != ''
        shell: pwsh
        run: |
          $binary = "target/${{ matrix.target }}/release/${{ matrix.binary }}"
          $signtool = Get-ChildItem -Path "${env:ProgramFiles(x86)}\Windows Kits\10\bin" `
              -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match '\\x64\\' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $signtool) { throw "signtool.exe not found on this runner" }

          $pfx = Join-Path $env:RUNNER_TEMP "tui-code-sign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          try {
            & $signtool.FullName sign /f $pfx /p $env:WINDOWS_CERTIFICATE_PASSWORD `
              /tr http://timestamp.digicert.com /td sha256 /fd sha256 $binary
            if ($LASTEXITCODE -ne 0) { throw "signtool sign failed ($LASTEXITCODE)" }
          } finally {
            Remove-Item $pfx -Force -ErrorAction SilentlyContinue
          }

          # Prove the signature actually landed rather than trusting the exit code.
          & $signtool.FullName verify /pa /v $binary
          if ($LASTEXITCODE -ne 0) { throw "signature verification failed ($LASTEXITCODE)" }

      # Sign + notarize the macOS binary. Opt-in on secrets, exactly like the
      # Windows signing above: unset -> skipped -> unsigned binary, build still
      # succeeds; set but failing -> the job fails rather than publishing an
      # unsigned binary under a release that claims to be signed.
      #   APPLE_CERTIFICATE            = base64 of the Developer ID .p12
      #   APPLE_CERTIFICATE_PASSWORD   = that .p12's password
      #   APPLE_SIGNING_IDENTITY       = e.g. "Developer ID Application: Name (TEAMID)"
      #   APPLE_ID / APPLE_PASSWORD    = Apple ID + app-specific password
      #   APPLE_TEAM_ID                = 10-char team id
      # Without this a downloaded binary is quarantined by Gatekeeper and the
      # user is told the app "cannot be opened because the developer cannot be
      # verified" — which reads as "this is malware", not "this is unsigned".
      - name: Sign and notarize binary (macOS)
        if: runner.os == 'macOS' && env.APPLE_CERTIFICATE != ''
        run: |
          set -euo pipefail
          binary="target/${{ matrix.target }}/release/${{ matrix.binary }}"

          # Import the certificate into a throwaway keychain so nothing is left
          # behind on the runner and the default keychain is untouched.
          keychain="$RUNNER_TEMP/netscope-signing.keychain-db"
          keypass="$(uuidgen)"
          security create-keychain -p "$keypass" "$keychain"
          security set-keychain-settings -lut 900 "$keychain"
          security unlock-keychain -p "$keypass" "$keychain"

          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$keypass" "$keychain" >/dev/null
          security list-keychain -d user -s "$keychain" login.keychain-db
          rm -f "$RUNNER_TEMP/cert.p12"

          # A CLI tool still needs the hardened runtime and a timestamp, or
          # notarization rejects it.
          codesign --force --options runtime --timestamp \
            --sign "$APPLE_SIGNING_IDENTITY" "$binary"
          codesign --verify --strict --verbose=2 "$binary"

          # notarytool only accepts archives, never a bare Mach-O.
          ditto -c -k --keepParent "$binary" "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait

          # A lone binary cannot be stapled (stapling needs a bundle/dmg), so
          # prove the ticket exists online instead of silently skipping it.
          spctl --assess --type execute --verbose=4 "$binary" || \
            echo "note: spctl assessment is advisory for a bare CLI binary"

          security delete-keychain "$keychain"

      - name: Warn that the macOS binary is unsigned
        if: runner.os == 'macOS' && env.APPLE_CERTIFICATE == ''
        run: |
          echo "::warning::APPLE_CERTIFICATE is not set — publishing an UNSIGNED, un-notarized macOS binary. Gatekeeper will block it on first launch."

      - name: Upload TUI binary
        uses: actions/upload-artifact@v4
        with:
          name: netscope-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/${{ matrix.binary }}
          if-no-files-found: error

  desktop:
    name: Desktop (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux
            bundles: "deb,appimage"
          - os: macos-latest
            name: macOS
            bundles: "dmg"
            # The runner is Apple Silicon, so a plain build produced an arm64
            # .dmg while the README advertised a universal one — Intel Macs got
            # an installer they could not run, or nothing at all.
            extra_args: "--target universal-apple-darwin"
          - os: windows-latest
            name: Windows
            bundles: "nsis,msi"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    # Windows Authenticode signing is opt-in: set these two repo secrets to sign
    # the .msi/.exe (and the app exe inside them). Left unset, the signing step is
    # skipped and unsigned installers are produced — the build still succeeds.
    #   WINDOWS_CERTIFICATE          = base64 of the code-signing .pfx
    #   WINDOWS_CERTIFICATE_PASSWORD = that .pfx's password
    env:
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      # Job level, not step level: a step's `if:` cannot read its own `env:`.
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
    steps:
      - uses: actions/checkout@v4
      # Both Darwin arches are needed for the universal bundle: `cargo tauri
      # build --target universal-apple-darwin` builds each and lipos them, and
      # fails outright if either target's std is missing.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'wasm32-unknown-unknown,aarch64-apple-darwin,x86_64-apple-darwin' || 'wasm32-unknown-unknown' }}
      - uses: Swatinem/rust-cache@v2

      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libpcap-dev

      - name: Install Npcap SDK (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://npcap.com/dist/npcap-sdk-1.13.zip" -OutFile "$env:TEMP\npcap-sdk.zip" -UseBasicParsing
          Expand-Archive -Path "$env:TEMP\npcap-sdk.zip" -DestinationPath "$env:TEMP\npcap-sdk" -Force
          echo "LIBPCAP_LIBDIR=$env:TEMP\npcap-sdk\Lib\x64" | Out-File -FilePath $env:GITHUB_ENV -Append

      # `desktop/frontend/wasm/` is generated, not committed — and app.js opens
      # with `import initWasm from './wasm/netscope_wasm.js'`. Without this step
      # the bundler packaged a frontend whose first import 404s, so the shipped
      # installers came up to a blank window. It only worked on a developer
      # machine because the directory was left over from a local build.
      #
      # Built before the Tauri CLI is installed so a compile failure surfaces
      # before the slower step, the same ordering as ci.yml's frontend job.
      - name: Build WASM filter module
        run: cargo build -p netscope-wasm --release --target wasm32-unknown-unknown

      # Pinned to the `wasm-bindgen` crate version in Cargo.lock — the CLI
      # refuses to run against a module built by a different one. Same install
      # method and same version as ci.yml, so the two cannot drift apart
      # silently.
      - name: Install wasm-bindgen-cli
        run: cargo install wasm-bindgen-cli --version 0.2.126

      - name: Generate WASM bindings
        shell: bash
        run: |
          wasm-bindgen \
            --target web \
            --out-dir desktop/frontend/wasm \
            target/wasm32-unknown-unknown/release/netscope_wasm.wasm

      - name: Install Tauri CLI
        uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli@2

      # Derive the package version from the pushed tag (e.g. v1.2.3 -> 1.2.3)
      # so the produced installers carry the release version without any manual
      # bump of tauri.conf.json. Runs on every OS via bash (available on all runners).
      - name: Derive version from tag
        shell: bash
        working-directory: desktop/src-tauri
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Building version: $VERSION"
          echo "{\"version\": \"$VERSION\"}" > version.conf.json

      # Enable Tauri's native Authenticode signing when the cert secrets are set.
      # We import the .pfx into the runner's cert store, grab its thumbprint, and
      # merge bundle.windows.certificateThumbprint into version.conf.json so the
      # unchanged build step below signs both the installers and the app exe.
      # No secrets -> step is skipped -> installers are produced unsigned.
      - name: Enable Windows code signing
        if: runner.os == 'Windows' && env.WINDOWS_CERTIFICATE != ''
        shell: pwsh
        working-directory: desktop/src-tauri
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "code-sign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $securePwd = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $securePwd
          Remove-Item $pfx -Force
          $cfg = Get-Content version.conf.json -Raw | ConvertFrom-Json
          $windows = [pscustomobject]@{
            certificateThumbprint = $cert.Thumbprint
            digestAlgorithm       = "sha256"
            timestampUrl          = "http://timestamp.digicert.com"
          }
          $cfg | Add-Member -NotePropertyName bundle -NotePropertyValue ([pscustomobject]@{ windows = $windows }) -Force
          $cfg | ConvertTo-Json -Depth 10 | Set-Content version.conf.json
          Write-Host "Signing enabled with certificate thumbprint $($cert.Thumbprint)"

      # Tauri reads the APPLE_* variables itself: with them set it codesigns the
      # .app with the hardened runtime and submits the .dmg to notarytool;
      # without them it builds an unsigned bundle and says so. Same opt-in shape
      # as the Windows certificate above.
      - name: Build desktop
        run: cargo tauri build --ci --bundles "${{ matrix.bundles }}" ${{ matrix.extra_args }} --config version.conf.json
        working-directory: desktop/src-tauri
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Notarize and staple macOS DMG bundle
        if: runner.os == 'macOS' && env.APPLE_CERTIFICATE != ''
        shell: bash
        run: |
          set -euo pipefail
          dmg=$(find target/release/bundle/dmg target/universal-apple-darwin/release/bundle/dmg -name "*.dmg" 2>/dev/null | head -n 1)
          if [ -n "$dmg" ]; then
            echo "Submitting $dmg for notarization via xcrun notarytool..."
            xcrun notarytool submit "$dmg" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" \
              --wait
            echo "Stapling ticket to $dmg..."
            xcrun stapler staple "$dmg" || true
          fi
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Warn that the macOS bundle is unsigned
        if: runner.os == 'macOS' && env.APPLE_CERTIFICATE == ''
        run: |
          echo "::warning::APPLE_CERTIFICATE is not set — the .dmg is UNSIGNED and un-notarized. Gatekeeper will refuse it until the user clears the quarantine attribute."

      # netscope-desktop is a member of the root Cargo workspace, so Tauri emits
      # the bundles under the workspace-root target dir, NOT desktop/src-tauri/target.
      # The path below is relative to the workspace root (this step has no
      # working-directory), and `error` makes a future path drift fail loudly
      # instead of silently publishing a release with no installers.
      - name: Upload desktop bundle
        uses: actions/upload-artifact@v4
        with:
          name: netscope-desktop-${{ matrix.name }}
          path: |
            target/release/bundle/**
            target/universal-apple-darwin/release/bundle/**
          if-no-files-found: error

      - name: Find bundle fallback
        if: failure()
        shell: pwsh
        run: |
          Write-Host "Searching for bundle artifacts..."
          Get-ChildItem -Path "${{ github.workspace }}" -Recurse -Include "*.deb","*.AppImage","*.dmg","*.exe","*.msi" -ErrorAction SilentlyContinue | Select-Object FullName, Length

  agent:
    name: Agent (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: netscope-agent
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            binary: netscope-agent
          - os: macos-latest
            target: aarch64-apple-darwin
            binary: netscope-agent
          - os: macos-latest
            target: x86_64-apple-darwin
            binary: netscope-agent
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: netscope-agent.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      - name: Install libpcap (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libpcap-dev minisign

      - name: Build Agent binary
        shell: bash
        env:
          NETSCOPE_AGENT_UPDATE_PUBKEY: ${{ secrets.NETSCOPE_AGENT_UPDATE_PUBKEY }}
        run: cargo build -p netscope-agent --release --target ${{ matrix.target }}

      - name: Sign Agent binary (Ed25519 / Minisign)
        shell: bash
        env:
          NETSCOPE_AGENT_SECRET_KEY: ${{ secrets.NETSCOPE_AGENT_SECRET_KEY }}
        run: |
          BIN_PATH="target/${{ matrix.target }}/release/${{ matrix.binary }}"
          if [ -n "$NETSCOPE_AGENT_SECRET_KEY" ]; then
            echo "$NETSCOPE_AGENT_SECRET_KEY" > netscope-agent.key
            minisign -S -s netscope-agent.key -m "$BIN_PATH" -x "$BIN_PATH.sig"
            rm -f netscope-agent.key
          else
            echo "::warning::NETSCOPE_AGENT_SECRET_KEY secret not set — skipping signature step."
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: netscope-agent-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/${{ matrix.binary }}
            target/${{ matrix.target }}/release/${{ matrix.binary }}*.sig
          if-no-files-found: ignore

  release:
    name: Create Release
    needs: [tui, desktop, agent]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4

      - name: List downloaded artifacts
        run: find . -type f

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            netscope-x86_64-unknown-linux-gnu/netscope-tui
            netscope-aarch64-unknown-linux-gnu/netscope-tui
            netscope-aarch64-apple-darwin/netscope-tui
            netscope-x86_64-apple-darwin/netscope-tui
            netscope-universal-apple-darwin/netscope-tui
            netscope-x86_64-pc-windows-msvc/netscope-tui.exe
            netscope-aarch64-pc-windows-msvc/netscope-tui.exe
            netscope-desktop-Linux/**
            netscope-desktop-macOS/**
            netscope-desktop-Windows/**
            netscope-agent-*/**
          # Static preamble; with generate_release_notes the auto changelog is
          # appended below this body.
          body: |
            ## Installation requirements

            ### Windows — Npcap required
            The desktop app and TUI capture packets through **Npcap**, which is
            **not bundled** in the installer. Install it before running netscope:

            1. Download and run the installer from https://npcap.com/#download
            2. Keep **"Install Npcap in WinPcap API-compatible Mode"** checked

            Without Npcap, packet capture fails to start.

            ---
          generate_release_notes: true
          fail_on_unmatched_files: false
