name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ─────────────────────────────────────────────────────────────────────────────
# Jobs:
#   1. lint        — cargo clippy (deny warnings) + cargo fmt --check
#   2. test        — cargo test on Linux / macOS / Windows
#   3. frontend    — npm test (vitest) for desktop frontend unit tests
#   4. bench       — continuous benchmarks (parse, filter, pipeline, memory)
#   5. fuzz        — 60s of cargo-fuzz over the packet dispatch (Linux only)
# ─────────────────────────────────────────────────────────────────────────────

jobs:
  # ── 1. Lint ────────────────────────────────────────────────────────────────
  lint:
    name: Clippy + Rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Install libpcap-dev
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev

      # `netscope-server` generates its gRPC stubs in build.rs, so protoc has to
      # be on PATH before anything touches that crate — clippy included, since
      # `--workspace` builds it.
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # Output is teed to a file so the failure step below can put it in the job
      # summary. Downloading raw Actions logs needs *admin* rights on the repo
      # (the REST endpoint answers 403 to everyone else), so on a public repo a
      # red run is unreadable to exactly the people who would fix it —
      # contributors, and anyone triaging from a fork's PR. The step summary is
      # public, and readable over the API as `check-runs/{id}` → `output`.
      # `--all-targets` so tests and benches are linted too, not just the
      # library. Without it clippy sees only the `--lib`/`--bin` targets, and
      # test code — which is where this repo's correctness guards live — was
      # never checked at all. A lint error inside a `#[cfg(test)]` module
      # passed CI and only appeared on a contributor's machine.
      - name: Clippy (all workspace crates except desktop)
        id: clippy
        shell: bash
        run: |
          set -o pipefail
          cargo clippy --workspace --exclude netscope-desktop --all-targets -- -D warnings 2>&1 | tee clippy.log

      - name: Publish clippy failure to the job summary
        if: failure() && steps.clippy.outcome == 'failure'
        shell: bash
        run: |
          {
            echo "## Clippy failed"
            echo '```'
            grep -E "^(error|warning)" -A 6 clippy.log | tail -120
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Rustfmt
        id: rustfmt
        shell: bash
        run: |
          set -o pipefail
          cargo fmt --check 2>&1 | tee fmt.log

      - name: Publish rustfmt failure to the job summary
        if: failure() && steps.rustfmt.outcome == 'failure'
        shell: bash
        run: |
          {
            echo "## rustfmt failed"
            echo '```diff'
            tail -80 fmt.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ── 2. Rust tests (matrix: Linux, macOS, Windows) ─────────────────────────
  test:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Platform-specific packet capture library setup
      - name: Install libpcap-dev (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev

      - name: Install Npcap SDK (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Download and extract the Npcap SDK so the `pcap` crate can link
          $sdkUrl  = "https://npcap.com/dist/npcap-sdk-1.13.zip"
          $zipPath = "$env:TEMP\npcap-sdk.zip"
          $sdkDir  = "$env:TEMP\npcap-sdk"
          Invoke-WebRequest -Uri $sdkUrl -OutFile $zipPath -UseBasicParsing
          Expand-Archive -Path $zipPath -DestinationPath $sdkDir -Force
          # Expose LIB so the linker finds Packet.lib / wpcap.lib
          $libDir = "$sdkDir\Lib\x64"
          echo "LIB=$libDir;$env:LIB" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "LIBPCAP_LIBDIR=$libDir"| Out-File -FilePath $env:GITHUB_ENV -Append

      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # Build & test core, TUI, server and agent. The desktop crate is built and
      # tested separately below rather than added here — see that step.
      #
      # `netscope-server` and `netscope-agent` were absent from this list until
      # 2026-07-28, so the whole fleet-management tier — auth, RBAC, the API
      # router, the gRPC service, the sensor agent — was merged without ever
      # being compiled or tested on any platform. Nothing here needs a database:
      # the server's router tests hold a lazy pool that never dials, because the
      # permission check they exercise runs before the handler.
      - name: Build
        run: cargo build -p netscope-core -p netscope-tui -p netscope-server -p netscope-agent

      # `--no-fail-fast` so one bad crate does not hide the state of the other
      # three, and the log is teed so the failure step can surface it publicly —
      # see the comment on the clippy step for why the raw log is not enough.
      - name: Test
        id: test
        shell: bash
        run: |
          set -o pipefail
          cargo test --no-fail-fast -p netscope-core -p netscope-tui -p netscope-server -p netscope-agent 2>&1 | tee test.log

      - name: Publish test failure to the job summary
        if: failure() && steps.test.outcome == 'failure'
        shell: bash
        run: |
          {
            echo "## Tests failed on ${{ matrix.os }}"
            echo
            echo '### Failing test names'
            echo '```'
            grep -E "^(test .* FAILED|failures:$|    [a-z_:]+::[a-z_0-9:]+$)" test.log | head -60
            echo '```'
            echo '### Assertion / compile output'
            echo '```'
            grep -E "^(error|thread .* panicked|assertion|  left|  right|test result)" -A 4 test.log | tail -150
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The desktop crate's tests exercise `replay_packet`, which puts real
      # packets on the wire, so they are worth running. Linux is skipped
      # because Tauri needs seven apt packages there (libwebkit2gtk and
      # friends — see release.yml), which is a lot of setup time on every push
      # for two tests. Windows and macOS need nothing extra.
      #
      # This used to be impossible to fold into the line above: on Windows the
      # desktop test binary died with STATUS_ENTRYPOINT_NOT_FOUND before `main`
      # ran, because it had no application manifest requesting comctl32
      # version 6. `build.rs` links the manifest resource into test targets too,
      # scoped to `rustc-link-arg-tests` — which is why the crate's tests live in
      # `src-tauri/tests/`. Unscoped, it would also double the resource on the
      # bin and this job would fail to link under MSVC. See the comment there.
      - name: Test desktop
        if: runner.os != 'Linux'
        run: cargo test -p netscope-desktop

  # ── 3. Frontend tests (vitest) ─────────────────────────────────────────────
  frontend:
    name: Frontend (vitest)
    runs-on: ubuntu-latest
    # 15 minutes was not enough for what this job actually does on a cold cache:
    # a *release* wasm32 build of netscope-core (400+ dissector modules, an
    # 800 KB registry.rs) plus `cargo install wasm-bindgen-cli`, on a 2-core
    # runner. The same build takes tens of minutes on a developer machine.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/frontend-tests/package-lock.json

      # Compile first, tool second. `cargo install wasm-bindgen-cli` takes
      # minutes; a `netscope-core` that does not build for wasm32 is the more
      # likely failure and costs seconds to find. These were the other way
      # round, so the one real failure this job has caught so far only
      # surfaced after the slowest step in it had already run.
      - name: Build WASM filter module
        id: wasm
        shell: bash
        run: |
          set -o pipefail
          cargo build -p netscope-wasm --release --target wasm32-unknown-unknown 2>&1 | tee wasm.log

      - name: Publish WASM build failure to the job summary
        if: failure() && steps.wasm.outcome == 'failure'
        shell: bash
        run: |
          {
            echo "## WASM build failed"
            echo '```'
            grep -E "^(error|warning)" -A 6 wasm.log | tail -120
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install wasm-bindgen-cli
        run: cargo install wasm-bindgen-cli --version 0.2.126

      # The frontend tests load this module at runtime.
      - name: Generate WASM bindings
        run: |
          wasm-bindgen \
            --target web \
            --out-dir desktop/frontend/wasm \
            target/wasm32-unknown-unknown/release/netscope_wasm.wasm

      - name: Install npm dependencies
        run: npm ci
        working-directory: desktop/frontend-tests

      - name: Run frontend tests
        run: npm test
        working-directory: desktop/frontend-tests

  # ── 4. Benchmarks (quick mode) ─────────────────────────────────────────────
  bench:
    name: Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install libpcap-dev
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev

      # `pipeline_throughput` took over from `pipeline::tests::
      # bench_pipeline_throughput`, an `#[ignore]`d test that asserted a packet
      # rate off a single wall-clock reading and so ran for nobody. Criterion
      # samples it instead of failing when a runner is busy, which is the whole
      # reason the test could not stay a test.
      - name: Parse, filter & pipeline benchmarks (quick mode)
        run: |
          cargo bench -p netscope-core --bench parse_throughput -- --quick
          cargo bench -p netscope-core --bench filter_match -- --quick
          cargo bench -p netscope-core --bench pipeline_throughput -- --quick

      - name: Memory footprint (200k packets)
        run: MEM_PACKETS=200000 cargo bench -p netscope-core --bench mem_usage

  # ── 5. Fuzzing (bounded) ───────────────────────────────────────────────────
  # The dispatch parses bytes an attacker chooses, so it is worth fuzzing. This
  # job exists as much to stop the target rotting as to find bugs in sixty
  # seconds: it sat broken for a while — the manifest had no `[workspace]`
  # table so cargo refused to build the package at all, `netscope-core` pointed
  # at the workspace root instead of `crates/core`, and the target body was
  # still `cargo fuzz init`'s `// fuzzed code goes here`. None of that could
  # fail a build, because nothing built it.
  #
  # Linux only: `libfuzzer-sys` compiles a bundled libFuzzer whose Windows
  # support is MSVC-specific, so it cannot build on a windows-gnu host at all.
  fuzz:
    name: Fuzz (60s)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            fuzz

      - name: Install libpcap-dev
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      # A minute finds little on its own, but it proves the target still builds
      # and still reaches `dissect()`. A crash here is a real one: libFuzzer
      # writes the input to fuzz/artifacts/, which the step below uploads so it
      # can be reproduced rather than guessed at.
      - name: Run parse_packet_fuzz
        run: cargo fuzz run parse_packet_fuzz -- -max_total_time=60

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
          if-no-files-found: ignore
