[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/tui",
    "crates/wasm",
    "crates/server",
    "crates/agent",
    "desktop/src-tauri",
    "tools/gen-fixtures",
]

# Shared metadata inherited by the crates (see `*.workspace = true`).
[workspace.package]
version = "0.2.0"
edition = "2021"
# Floor imposed by the dependency graph (darling, time, plist all declare
# 1.88), so anything older cannot resolve at all — declaring it here turns that
# into a clear cargo error instead of a confusing build failure deep in a
# dependency. CI builds on stable; toolchains between this floor and stable are
# not exercised, so treat 1.88 as "will resolve", not "is tested".
rust-version = "1.88"
license = "LicenseRef-Proprietary"
authors = ["azzizefe"]
repository = "https://github.com/azzizefe/netscope"
homepage = "https://github.com/azzizefe/netscope"
readme = "README.md"
keywords = ["network", "packet", "capture", "wireshark", "tui"]
categories = ["network-programming", "command-line-utilities"]
# Nothing here goes to a public registry: crates.io only accepts OSI-approved
# licenses and makes every published source file world-readable, which is the
# opposite of what LICENSE says. `publish = false` makes `cargo publish` refuse
# rather than rely on nobody typing it. Distribution is via signed release
# binaries (.github/workflows/release.yml), not the registry.
publish = false

# Workspace-wide lint configuration, opted into per crate with `[lints]
# workspace = true`.
[workspace.lints.clippy]
# clippy 0.1.96 false-positives this lint on `thread_local!` initializers that
# already use a `const { ... }` block — it fires with no applicable suggestion
# (see crates/core/src/dissectors/{wlan,vxlan}.rs). The code is already correct;
# disable this one buggy lint until the upstream fix lands, rather than sprinkle
# per-item `#[allow]`s. Remove when the toolchain fix ships.
missing_const_for_thread_local = "allow"
