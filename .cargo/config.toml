[env]
# Windows only in intent, but cargo's `[env]` cannot be scoped per target, so it
# is also set on Linux and macOS — where the directory does not exist. That is
# not fatal (the pcap build script falls back to `Version::max()` when it cannot
# load a library from the path) but it has two effects worth knowing:
#
#   * pkg-config is skipped, because the crate only probes it when
#     LIBPCAP_LIBDIR is unset. The real libpcap is still found through the
#     linker's default paths.
#   * the libpcap version is assumed to be 1.9.1 rather than detected. On a host
#     with an older libpcap this can enable API that is not there, and the
#     failure surfaces as a link error naming a pcap symbol.
#
# On such a host, export the real directory before building — a value already in
# the environment wins over this file:
#
#   LIBPCAP_LIBDIR=/usr/lib/x86_64-linux-gnu cargo build
LIBPCAP_LIBDIR = { value = "npcap-sdk/Lib/x64", relative = true }

# rustc's LLVM optimize pass overflows its default 8 MB worker stack while
# building the test binary, and dies with STATUS_STACK_OVERFLOW (0xc00000fd)
# rather than a diagnostic — so `cargo test` reads as "the crate does not
# compile". The cause is sheer size: `dissectors.rs` dispatches 400+ modules,
# and the generated match is deep enough to recurse past the default.
#
# It surfaces intermittently, because only the modules cargo actually rebuilds
# get re-optimised — a warm incremental build can miss it and the next one hit
# it. `cargo check` never codegens, so it always looks fine.
#
# Cargo does not override a value already in the environment, so exporting a
# larger RUST_MIN_STACK still wins over this floor.
RUST_MIN_STACK = "134217728" # 128 MB
