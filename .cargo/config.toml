[env]
# Windows only in intent, but cargo's `[env]` cannot be scoped per target, so it
# is also set on Linux and macOS — where the directory does not exist. That is
# not fatal (the pcap build script falls back to `Version::max()` when it cannot
# load a library from the path) but it has two effects worth knowing:
#
#   * pkg-config is skipped, because the crate only probes it when
#     LIBPCAP_LIBDIR is unset. The real libpcap is still found through the
#     linker's default paths.
#   * the libpcap version is assumed to be 1.9.1 rather than detected. On a host
#     with an older libpcap this can enable API that is not there, and the
#     failure surfaces as a link error naming a pcap symbol.
#
# On such a host, export the real directory before building — a value already in
# the environment wins over this file:
#
#   LIBPCAP_LIBDIR=/usr/lib/x86_64-linux-gnu cargo build
LIBPCAP_LIBDIR = { value = "npcap-sdk/Lib/x64", relative = true }

# rustc's LLVM optimize pass overflows its default 8 MB worker stack while
# building the test binary, and dies with STATUS_STACK_OVERFLOW (0xc00000fd)
# rather than a diagnostic — so `cargo test` reads as "the crate does not
# compile". The cause is sheer size: `dissectors.rs` dispatches 400+ modules,
# and the generated match is deep enough to recurse past the default.
#
# It surfaces intermittently, because only the modules cargo actually rebuilds
# get re-optimised — a warm incremental build can miss it and the next one hit
# it. `cargo check` never codegens, so it always looks fine.
#
# Cargo does not override a value already in the environment, so exporting a
# larger RUST_MIN_STACK still wins over this floor.
RUST_MIN_STACK = "134217728" # 128 MB

# The release wasm build — CI's `frontend` job, and the display-filter engine
# the desktop frontend loads — does not fit in the memory of the machine that
# runs it. Measured on a 31.6 GB developer machine at cargo's release defaults
# (`opt-level=3`, `codegen-units=16`): one rustc at 23.8 GB resident and still
# climbing after 44 CPU minutes, killed rather than allowed to exhaust the box.
# A GitHub-hosted runner has 7 GB, which is what the job's SIGTERM says.
#
# `netscope-core` is the crate that does it: 400+ dissector modules and an
# 800 KB `registry.rs`. Peak resident memory of the whole build, measured here
# rather than reasoned about, sampling every 3s with an abort at 2.5 GB free:
#
#   opt-level  codegen-units  -j   peak      result
#   3 (dflt)   16 (dflt)      16   23.8 GB   killed, still climbing at 44 CPU min
#   3          256             2   21.2 GB   killed, no .wasm produced
#   z          16              2    8.2 GB   ok, 3.0 min, 1.09 MB
#   z          256             2    7.5 GB   ok, 2.6 min, 1.09 MB
#   z          256            16    8.0 GB   ok, 1.7 min, 1.09 MB
#
# So `opt-level` is the lever, not the unit count: at `-O3` this does not build
# even split 256 ways and pinned to two jobs. Splitting is still worth keeping —
# 0.7 GB, and the margin is where it matters. Parallelism barely moves it
# (7.5 vs 8.0), so the cost is LLVM's work per function, not threads holding
# modules at once.
#
# Honest about the remaining margin: 7.5 GB clears a 16 GB runner comfortably
# and a 7 GB one not at all. If that job is still killed, the next thing to cut
# is what gets compiled — the wasm filter engine may not need the whole registry
# — not another flag.
#
# `z` is a real cost: this wasm is the display-filter engine the desktop
# frontend runs as the user types. It is here because the alternative measured
# above is a build nobody can run, not because size was the goal — the file
# ships inside the desktop bundle and is never downloaded.
#
# Scoped to the target rather than `[profile.release]` on purpose: the native
# release binaries are where speed matters, and they keep cargo's defaults.
[target.wasm32-unknown-unknown]
rustflags = ["-C", "opt-level=z", "-C", "codegen-units=256"]

# `wpcap.dll` is Npcap's runtime library, and Npcap is a separate download that
# a Windows machine does not have by default. Linked normally it is a *load-time*
# import: the loader resolves it before `main`, and on a machine without Npcap
# every netscope binary dies with `STATUS_DLL_NOT_FOUND (0xc0000135)` — no
# window, no message, no exit code anyone can act on. CI's Windows job shows
# exactly this, and so would any user who ran the app before installing Npcap.
#
# Delay-loading moves that resolution to the first call into the library. The
# binary starts; `capture::packet_library_available()` is then what decides,
# and it returns an error naming the download instead of taking the process
# down. Never remove one without the other: a delay-load failure is a
# structured exception (0xC06D007E), which no Rust `Result` can catch.
#
# `delayimp.lib` provides the helper the linker calls to resolve the import
# lazily. `/IGNORE:4199` silences "delayload ignored; no imports found" on the
# binaries in this workspace that never touch pcap — most of them.
#
# MSVC only: this is the toolchain CI and the release bundles use, and
# `/DELAYLOAD` is a MSVC linker feature. A windows-gnu build keeps the
# load-time import and still needs Npcap present to start.
[target.'cfg(all(windows, target_env = "msvc"))']
rustflags = [
  "-C", "link-arg=/DELAYLOAD:wpcap.dll",
  "-C", "link-arg=delayimp.lib",
  "-C", "link-arg=/IGNORE:4199",
]
